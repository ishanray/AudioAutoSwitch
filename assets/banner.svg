<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a24"/>
      <stop offset="1" stop-color="#0d1a5c"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6ecff"/>
      <stop offset="0.55" stop-color="#7f9bff"/>
      <stop offset="1" stop-color="#2f55ff"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f55ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4d6dff"/>
      <stop offset="1" stop-color="#9fb3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#2f55ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f55ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- Cable running in from the left, ending in a USB-C plug -->
  <path d="M0 330 C 260 330, 330 250, 560 270 S 860 330, 1010 300" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round"/>
  <rect x="1010" y="286" width="58" height="28" rx="8" fill="#9fb3ff"/>
  <rect x="1068" y="292" width="34" height="16" rx="8" fill="#c9d4ff"/>

  <g font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="84" y="170" font-size="104" font-weight="800" letter-spacing="-4" fill="url(#type)">Audio Auto Switch</text>
    <text x="88" y="226" font-size="30" font-weight="500" fill="#9fb3ff">Plug in your headphones. Your Mac plays through them.</text>
  </g>
</svg>
